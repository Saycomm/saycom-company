    <meta charset="UTF-8">

    <meta name="description" content="Познакомьтесь с командой профессионалов SAYCOM. Наши инженеры и монтажники обеспечивают высшее качество услуг.">
    <meta property="og:title" content="Наша Команда | SAYCOM">
    <meta property="og:image" content="uploads/icon_premium_v2.png">
    <link rel="stylesheet" href="css/style.css?v=2.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060B15;
            --card-bg: rgba(13, 20, 33, 0.7);
            --primary: #10B981;
            --text-muted: #94A3B8;
        }
        body {
            background-color: var(--bg-dark);
            margin: 0;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* STYLISH BACKGROUND */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }
        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: move 20s infinite alternate;
        }
        .blob-1 { top: -100px; left: -100px; background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%); }
        .blob-2 { bottom: -100px; right: -100px; background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%); animation-delay: -5s; }
        
        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 100px) scale(1.2); }
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* HEADER STYLING */
        .header {
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: rgba(6, 11, 21, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 20px 0;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .container-nav { display: flex; justify-content: space-between; align-items: center; }
        
        .nav a { color: var(--text-muted); text-decoration: none; margin-left: 30px; font-weight: 600; font-size: 14px; transition: 0.3s; }
        .nav a:hover { color: var(--primary); }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
            margin-top: 60px;
        }
        .team-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 30px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            cursor: pointer;
            position: relative;
        }
        .team-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 30px rgba(16, 185, 129, 0.15);
        }
        .team-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
        }
        .team-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }
        .team-card:hover .team-img-wrap img {
            transform: scale(1.1);
        }
        .team-info {
            padding: 30px 20px;
            text-align: center;
        }
        .team-info h4 {
            font-size: 20px;
            font-weight: 800;
            color: white;
            margin: 0 0 8px 0;
        }
        .team-info p {
            font-size: 13px;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }
        /* ... Modal styles stay similar but improved below ... */
        @media (max-width: 768px) {
            .team-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                margin-top: 40px;
            }
            .team-info {
                padding: 15px 10px;
            }
            .team-info h4 {
                font-size: 14px;
                word-break: break-word;
            }
            .team-info p {
                font-size: 10px;
                letter-spacing: 1px;
            }
            h1 {
                font-size: 28px !important;
            }
            main p {
                font-size: 14px !important;
            }
        }
    </style>
    

    <!-- Mobile Nav Fix -->
    <style>
        /* --- Mobile Responsiveness Improved --- */
        @media (max-width: 768px) {
            /* Scrollable Navigation */
            
            
            

            
            

            /* Category Hero resizing */
            .category-hero {
                flex-direction: column !important;
                text-align: center !important;
                padding-bottom: 20px !important;
            }
            .cat-hero-text h1 {
                font-size: 28px !important;
                margin: 10px 0 !important;
            }
            .cat-hero-img {
                width: 100% !important;
                height: 150px !important;
                margin-top: 20px;
            }

            /* Shop Layout */
            .shop-layout {
                flex-direction: column !important;
            }
            .shop-sidebar {
                width: 100% !important;
                margin-bottom: 30px;
            }
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)) !important;
                gap: 15px !important;
            }
            .product-card {
                padding: 15px !important;
            }
            .p-title {
                font-size: 14px !important;
            }
            .p-price {
                font-size: 16px !important;
            }
            
            /* Footer stacking */
            .footer .container {
                flex-direction: column !important;
            }
            .footer-left, .footer-right {
                width: 100% !important;
                padding: 20px !important;
                border: none !important;
            }
            .footer-right > div {

                gap: 20px !important;

        }
    </style>

    <link rel="apple-touch-icon" href="/uploads/icon_premium_v2.png">
</head>
<body class="dark-theme">
    <!-- Stylish Background Layers -->
    <div class="bg-mesh">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="bg-grid"></div>

    <!-- Navbar -->
    <header class="header" style="background: var(--bg-light); border-bottom: 1px solid var(--border-color); padding: 15px 0;">
        <div class="container header-container" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="logo" style="display: flex; align-items: center; gap: 12px; cursor: pointer;" onclick="window.location.href='index.html'">
                <img src="uploads/icon_premium_v2.png" alt="SAYCOM Logo" style="width: 40px; height: 40px; border-radius: 8px; object-fit: contain;">
                <div class="logo-text">
                    <div class="logo-title" style="font-weight: 700; font-size: 16px; color: white;" data-i18n="auto_team_155">SAYCOM</div>
                </div>
            </div>
            
            <a href="javascript:history.back()" style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-weight: 600; font-size: 14px; transition: 0.2s; text-decoration: none;" class="back-link">
                <i class="fa-solid fa-arrow-left" style="font-size: 12px;"></i><span data-i18n="back_text">Назад</span></a>
            <style>
                .back-link:hover { color: var(--primary); transform: translateX(-5px); }
            </style>
        </div>
    </header>

    <main style="padding: 120px 0 80px;">
        <div class="container">
            <div style="text-align:center; margin-bottom:60px;">
                <h1 style="font-size:48px; font-weight:800; color:white; margin-bottom:15px;" data-i18n="auto_team_167">Наша Команда</h1>
                <p style="color:var(--text-muted); font-size:18px; max-width:700px; margin:0 auto;" data-i18n="auto_team_168">Познакомьтесь с экспертами, которые создают будущее технологий вместе с SAYCOM.</p>
            </div>

            <div id="team-grid" class="team-grid">
                <!-- Loaded from API -->
            </div>
        </div>
    </main>

    <!-- Team Detail Modal -->
    <div id="teamModal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); z-index:9999; align-items:center; justify-content:center; padding:20px;">
        <div class="modal-content" style="background:#0D1421; width:100%; max-width:800px; border-radius:24px; border:1px solid rgba(255,255,255,0.05); overflow:hidden; position:relative; display:flex;">
            <button onclick="closeTeamModal()" style="position:absolute; top:20px; right:20px; background:rgba(255,255,255,0.05); border:none; color:white; width:40px; height:40px; border-radius:50%; cursor:pointer; z-index:10;"><i class="fa-solid fa-xmark"></i></button>
            <div style="width:350px; background:#060B15; position:relative;">
                <img id="m-image" src="" style="width:100%; height:100%; object-fit:cover;">
            </div>
            <div style="flex:1; padding:40px;">
                <h2 id="m-name" style="font-size:28px; font-weight:800; color:white; margin-bottom:5px;"></h2>
                <p id="m-role" style="color:var(--primary); font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:1px; margin-bottom:25px;"></p>
                
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:30px;">
                    <div style="background:rgba(255,255,255,0.02); padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.03);">
                        <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; margin-bottom:5px;" data-i18n="auto_team_169">Опыт работы</div>
                        <div id="m-experience" style="font-size:16px; font-weight:700; color:white;"></div>
                    </div>
                    <div style="background:rgba(255,255,255,0.02); padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.03);">
                        <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; margin-bottom:5px;" data-i18n="auto_team_170">Специализация</div>
                        <div id="m-specialization" style="font-size:16px; font-weight:700; color:white;"></div>
                    </div>
                </div>

                <div style="margin-bottom:30px;">
                    <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; margin-bottom:10px;" data-i18n="auto_team_171">Биография</div>
                    <p id="m-bio" style="color:var(--text-muted); font-size:14px; line-height:1.6;"></p>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(255,255,255,0.05); padding-top:20px;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <div style="color:#FBBF24;"><i class="fa-solid fa-star"></i> <b id="m-rating" data-i18n="auto_team_172">5.0</b></div>
                        <div style="color:var(--text-muted); font-size:12px;"><span data-i18n="auto_team_173">(</span><span id="m-reviews">0</span><span data-i18n="auto_team_174">отзывов)</span></div>
                    </div>
                    <a id="m-linkedin" href="#" target="_blank" style="background:#0077B5; color:white; padding:10px 20px; border-radius:8px; text-decoration:none; font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px;">
                        <i class="fa-brands fa-linkedin"></i><span data-i18n="auto_team_175">LinkedIn</span></a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/app.js"></script>
    <script>
        let allTeamMembers = {};

        async function loadTeam() {
            try {
                const res = await fetch('/api/team');
                const data = await res.json();
                const container = document.getElementById('team-grid');
                const members = data.data || [];
                
                members.forEach(m => allTeamMembers[m.id] = m);

                container.innerHTML = members.map(m => `
                    <div class="team-card" onclick="openTeamModal(${m.id})">
                        <div class="team-img-wrap">
                            <img src="${m.image_url}" alt="${m.name}" onerror="this.src='/uploads/team-placeholder.png'">
                        </div>
                        <div class="team-info">
                            <h4>${m.name}</h4>
                            <p>${m.role}</p>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        function openTeamModal(id) {
            const m = allTeamMembers[id];
            if(!m) return;
            document.getElementById('m-image').src = m.image_url;
            document.getElementById('m-name').innerText = m.name;
            document.getElementById('m-role').innerText = m.role;
            document.getElementById('m-experience').innerText = m.experience + ' лет';
            document.getElementById('m-specialization').innerText = m.specialization || 'General Engineer';
            document.getElementById('m-bio').innerText = m.bio || 'Professional expert at SAYCOM.';
            document.getElementById('m-rating').innerText = m.rating || '5.0';
            document.getElementById('m-reviews').innerText = m.reviews_count || '0';
            document.getElementById('m-linkedin').href = m.linkedin_url || '#';
            
            document.getElementById('teamModal').style.display = 'flex';
        }

        function closeTeamModal() {
            document.getElementById('teamModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('teamModal');
            if (event.target == modal) closeTeamModal();
        }

        document.addEventListener('DOMContentLoaded', loadTeam);
    </script>


</body></html>
